name: Testing with Ubuntu 18 docker

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-docker-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pre-load docker image
        run: docker pull ghcr.io/mantidproject/mantidimaging:ubuntu18

      - name: yapf
        uses: ./.github/actions/test
        with:
          command: pixi run yapf
          label: ubuntu18

      - name: ruff
        uses: ./.github/actions/test
        with:
          command: pixi run ruff
          label: ubuntu18

      - name: json
        uses: ./.github/actions/test
        with:
          command: npx prettier --check "**/*.json"
          label: ubuntu18

      - name: yaml
        uses: ./.github/actions/test
        with:
          command: npx prettier --check "**/*.y?(a)ml" "!conda/recipe.yaml" "!conda/meta.yaml"
          label: ubuntu18

      - name: mypy
        uses: ./.github/actions/test
        with:
          command: pixi run mypy
          label: ubuntu18

      - name: pytest
        timeout-minutes: 5
        uses: ./.github/actions/test
        with:
          command: pixi run -e dev xvfb-run pytest -n auto --maxprocesses=4 --dist loadgroup -o log_cli=true --ignore=mantidimaging/eyes_tests --durations=10
          label: ubuntu18
