name: Testing on Windows

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
  release:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      CONDA_OVERRIDE_CUDA: 11.8

    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to get tags so that git describe works during package build
          fetch-depth: "0"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.59.0
          environments: >-
            dev
            lint
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: List versions
        shell: bash -l {0}
        run: |
          pixi run -e dev python --version
          pixi list -e dev

      - name: Yapf
        shell: bash -l {0}
        run: |
          pixi run yapf

      - name: Ruff
        shell: bash -l {0}
        run: |
          pixi run ruff

      - name: mypy
        shell: bash -l {0}
        run: |
          pixi run mypy

      - name: pyright
        shell: bash -l {0}
        run: |
          pixi run pyright

      - name: pytest
        timeout-minutes: 10
        shell: bash -l {0}
        run: |
          pixi run -e dev python -m pytest --cov --cov-report=xml -n auto --maxprocesses=4 --dist loadgroup -o log_cli=true --ignore=mantidimaging/eyes_tests --durations=10

      - name: Get test data
        shell: bash -l {0}
        run: |
          curl -L https://github.com/mantidproject/mantidimaging-data/archive/refs/tags/small.zip --output small.zip
          unzip -q small.zip -d ~
          mv ~/mantidimaging-data-small ~/mantidimaging-data
        timeout-minutes: 5

      - name: GUI Tests System
        shell: bash -l {0}
        run: |
          pixi run test-system-cpu
        timeout-minutes: 20

      - name: Set display resolution for screenshot tests
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
        shell: pwsh

      - name: GUI Tests Screenshots Applitools
        if: github.event_name == 'pull_request'
        shell: bash -l {0}
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_ID: ${{ github.sha }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pixi run test-screenshots-cpu
        timeout-minutes: 15

      # Label as 'windows-build-test' for testing purposes.
      # To re-enable, use the if rule from the conda workflow and change label to 'unstable' after testing
      - name: publish package
        if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')))
        uses: ./.github/actions/publish-package
        with:
          label: unstable
          token: ${{ secrets.ANACONDA_API_TOKEN_MANTIDIMAGING }}
        timeout-minutes: 120

      - name: Show disk space at end
        if: ${{ !cancelled() }}
        run: |
          df -h
        shell: bash
