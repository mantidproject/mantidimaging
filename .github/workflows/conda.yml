name: Testing with conda

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
  release:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-conda:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to get tags so that git describe works during package build
          fetch-depth: "0"

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%V")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.59.0
          environments: >-
            dev
            lint
            ci
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Other dependencies
        shell: bash -l {0}
        run: |
          sudo apt update -y
          sudo apt-get install -y xvfb libxcb* libxkb*

      - name: List versions
        shell: bash -l {0}
        run: |
          pixi run -e dev python --version
          pixi list -e dev

      - name: Yapf
        shell: bash -l {0}
        run: |
          pixi run yapf

      - name: Ruff
        shell: bash -l {0}
        run: |
          pixi run ruff

      - name: mypy
        shell: bash -l {0}
        run: |
          pixi run mypy

      - name: pyright
        shell: bash -l {0}
        run: |
          pixi run pyright

      - name: pytest
        timeout-minutes: 10
        shell: bash -l {0}
        run: |
          pixi run -e dev xvfb-run --auto-servernum python -m pytest --cov --cov-report=xml -n auto --maxprocesses=4 --dist loadgroup -o log_cli=true --ignore=mantidimaging/eyes_tests --durations=10

      - name: Get test data
        shell: bash -l {0}
        run: |
          wget -nv https://github.com/mantidproject/mantidimaging-data/archive/refs/tags/small.zip
          unzip -q small.zip -d ~
          mv ~/mantidimaging-data-small ~/mantidimaging-data
        timeout-minutes: 5

      - name: GUI Tests System
        shell: bash -l {0}
        run: |
          pixi run test-system-cpu
        timeout-minutes: 30

      - name: GUI Tests Screenshots Applitools
        if: github.event_name == 'pull_request'
        shell: bash -l {0}
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_ID: ${{ github.sha }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pixi run test-screenshots-cpu-ci
        timeout-minutes: 15

      - name: Coveralls
        continue-on-error: true
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run -e dev coveralls

      # Always label as unstable. Builds of stable releases can be manually labeled to 'main' once tested
      - name: publish 'unstable' package
        if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')))
        uses: ./.github/actions/publish-package
        with:
          label: unstable
          token: ${{ secrets.ANACONDA_API_TOKEN_MANTIDIMAGING }}
        timeout-minutes: 120

      - name: Show disk space at end
        if: ${{ !cancelled() }}
        run: |
          df -h
        shell: bash
